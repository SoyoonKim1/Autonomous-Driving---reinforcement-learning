# 과제1에서 설치한 환경을 그대로 사용합니다. 경로는 assignment2/ 기준입니다.
language: kor
inference_device: auto  # auto / cpu / cuda / mps
collect:
  model_path: latest  # 매 실행 시 최신 agent + 저장된 구조, 없으면 baseline
  data_dir: data/centered
  epsilon: 0.02  # 98% 모델의 최선 행동 / 2% 무작위 행동 (0~1)
train:
  data_dir: data/centered  # 이번 보상으로 새로 모은 완주만 사용
  epochs: 5  # 매 epoch마다 모든 완료된 데이터 사용
  device: auto  # auto / cuda / mps / cpu
  num_workers: 2  # 병렬 파일 읽기 (0: 순차 읽기, 최대 16)
  batch_size: 64
  learning_rate: 0.00001
  gamma: 0.99
  conservative_weight: 0.1
evaluate:
  model_path: latest
